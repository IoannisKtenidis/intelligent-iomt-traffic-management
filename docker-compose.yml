version: '3.8'

services:
  simulator:
    build: .
    image: lora-simulator:latest
    container_name: lora_sim_container
    volumes:
      # Mount results and figures so generated data is written back to your host machine
      - ./Results_Data:/app/Results_Data
      - ./Figures:/app/Figures
      # Mount core code to allow running training or modification without rebuilding image
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./models:/app/models
    # Default execution command. Can be overridden in command line.
    command: python scripts/run_all_scenarios.py
